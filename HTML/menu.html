<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Minecraft - Menu</title>
    <style>
        body {
            background-image: url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRGykqAVf3mPHOrY1zUc0eYQyTel7Ser1uvVSE_oVxhnQ&s=10');
            background-repeat: no-repeat;  
            background-position: top; 
            background-size: cover;
            height: 100vh; 
            width: 100vw;
            margin: 0; 
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Courier New', Courier, monospace;
            transition: 0.5s;
        }

        /* Camada escura para o modo Noite */
        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(10, 15, 45, 0);
            pointer-events: none;
            transition: background 0.5s ease;
            z-index: 1;
        }

        body.noite::after {
            background: rgba(10, 15, 45, 0.65);
        }

        /* Caixa principal estilo inventário/bloco do Minecraft */
        .caixa-texto {
            background-color: rgba(25, 25, 25, 0.88);
            border: 4px solid #555;
            box-shadow: inset 0 0 0 4px #222, 0 10px 25px rgba(0,0,0,0.7);
            color: white; 
            padding: 25px; 
            border-radius: 6px; 
            width: 480px;
            max-width: 92vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            z-index: 2;
        }

        /* Navegação padronizada */
        nav {
            display: flex;
            justify-content: center;
            gap: 15px;
            background-color: #111;
            border: 2px solid #444;
            padding: 10px 15px;
            border-radius: 4px;
            margin-bottom: 15px;
            width: 100%;
            box-sizing: border-box;
        }

        nav a {
            color: #ddd;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
            transition: 0.2s;
        }

        nav a:hover {
            color: #55ff55;
            transform: scale(1.05);
        }

        .topo-controles {
            width: 100%;
            display: flex;
            justify-content: flex-end;
            margin-bottom: 10px;
        }

        .btn-noite {
            padding: 6px 12px;
            font-size: 13px;
            background: #333;
            color: white;
            border: 2px solid #666;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
        }

        .btn-noite:hover {
            background: #444;
        }

        h1 {
            text-align: center;
            margin: 5px 0 15px 0;
            font-size: 24px;
            text-shadow: 2px 2px #000;
            color: #ffff55;
        }

        /* Painel de contadores estilo barra de inventário */
        .painel-contadores {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 10px;
            width: 100%;
            box-sizing: border-box;
            font-size: 14px;
            font-weight: bold;
            background-color: #111;
            border: 3px solid #444;
            padding: 10px;
            margin-bottom: 15px;
            text-shadow: 1px 1px #000;
        }

        /* Grade da Mina */
        .mina { 
            width: 100%; 
            max-width: 380px;
            margin: 10px auto 20px auto; 
            display: grid; 
            grid-template-columns: repeat(5, 1fr); 
            gap: 6px; 
        } 

        /* Blocos com relevo pixelado */
        .bloco { 
            height: 62px; 
            background-color: #7a7a7a; 
            border: 3px solid #3a3a3a; 
            box-shadow: inset 3px 3px 0 #9e9e9e, inset -3px -3px 0 #555555;
            cursor: pointer; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            font-size: 28px; 
            user-select: none;
            transition: 0.1s;
        } 

        .bloco:hover { 
            background-color: #8c8c8c;
            border-color: #55ff55;
            transform: scale(1.04); 
        } 

        .quebrado { 
            background-color: #181818; 
            border-color: #2c2c2c;
            box-shadow: inset 3px 3px 0 #0d0d0d;
            cursor: default; 
            transform: none !important;
        }

        /* Botão de Reset estilo clássico Minecraft (vermelho) */
        .btn-reset {
            background-color: #a82828;
            color: white;
            border: 3px solid #521111;
            box-shadow: inset 0 4px 0 #d63c3c, inset 0 -4px 0 #781919;
            padding: 12px 20px;
            width: 100%;
            font-size: 16px;
            font-family: inherit;
            font-weight: bold;
            text-shadow: 2px 2px #521111;
            cursor: pointer;
            transition: 0.1s;
        }

        .btn-reset:hover {
            background-color: #bf3030;
        }

        .btn-reset:active {
            transform: translateY(2px);
        }
    </style>
</head>
<body id="corpo">

        <div class="caixa-texto">
            <nav>
            <a href="/">🛏️ Respawn</a>
            <a href="/mina">⛏️ Minerar</a>
            <a href="/skins">👕 Skins</a>
            <a href="/menu">🏠 Menu</a>
        </nav>
           
            <div class="clock">
                <button id="botao-horario" onclick="mudarHorario()"> 🌙 Mudar para Noite </button>
            </div>
            
            <div class="biome"> 
                <h1 id="titulo">🌍 Escolha seu Bioma</h1> 
                <button onclick="mudarBioma('floresta')"> 🌲 Floresta </button> 
                <button onclick="mudarBioma('deserto')"> 🌵 Deserto </button> 
                <button onclick="mudarBioma('neve')"> ❄️ Neve </button> 
                <button onclick="mudarBioma('nether')"> 🔥 Nether </button> 
            </div>

            <div class="personagem" id="personagem"> 🧑 </div>
            
            <div>
                <h2>Escolha a cabeça</h2> 
                <button onclick="mudarCabeca('😎')"> 😎 </button> 
                <button onclick="mudarCabeca('😈')"> 😈 </button> 
                <button onclick="mudarCabeca('🙂')"> 🙂 </button>
            </div>

            <div>
                <h2>Escolha o item</h2> 
                <button onclick="mudarItem('⚔️')"> ⚔️ Espada </button> 
                <button onclick="mudarItem('⛏️')"> ⛏️ Picareta </button> 
                <button onclick="mudarItem('🏹')"> 🏹 Arco </button>
            </div>
        </div>

    <script> 
        let cabeca = "🧑"; 
        let item = ""; 

        function atualizarPersonagem() {
            document.getElementById("personagem").innerHTML = cabeca + "<br>" + item; 
        } 

        function mudarCabeca(novaCabeca) {
            cabeca = novaCabeca; 
            atualizarPersonagem(); 
        } 

        function mudarItem(novoItem) { 
            item = novoItem; 
            atualizarPersonagem(); 
        }

        function mudarHorario() { 
            document.body.classList.toggle("noite"); 
            let titulo = document.getElementById("titulo"); 
            let botao = document.getElementById("botao-horario"); 
            
            if (document.body.classList.contains("noite")) { 
                titulo.innerHTML = "🌙 Minecraft à Noite"; 
                botao.innerHTML = "☀️ Mudar para Dia"; 
            } else { 
                titulo.innerHTML = "☀️ Minecraft de Dia"; 
                botao.innerHTML = "🌙 Mudar para Noite"; 
            } 
        } 

        function mudarBioma(bioma) {
            const bodyvar = document.getElementById("corpo");
            if (bioma == "floresta") {
                bodyvar.style.backgroundImage = "url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQnwrIR_AqrkB8p4yZk05yEGy2hlr1e8hF9iye7NqC6qg&s=10')"; 
            } 
            else if (bioma == "deserto") { 
                bodyvar.style.backgroundImage = "url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQbZgnDu4YOf1IiCFej3STmTvb1yFfOFIX8xeoGao_Oaw&s=10')"; 
            } 
            else if (bioma == "neve") { 
                bodyvar.style.backgroundImage = "url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQDzjP9TvAqMaNt8eUXvmbiJOd-nPWJ5T7_z-L93b6dpQ&s=10')"; 
            } 
            else if (bioma == "nether") { 
                bodyvar.style.backgroundImage = "url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTujgjSVC8qpw8-S2fWUameOMB9CsmVMPd-m_iSYm5y7A&s=10')"; 
            }
        }
    </script>
</body>
</html>
