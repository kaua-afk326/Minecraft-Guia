<html>
<head>
        <title>Minecraft - Menu</title>
</head>

<body id="corpo">

        <div class="caixa-texto">
            <nav style="text-align: center;">
                    <a href="/respawn">Respawn</a>---
                    <a href="/mina">Minerar</a>---
                    <a href="/skins">Skins</a>---
                    <a href="/menu">Menu</a>
                    <br>
            </nav>
           
            <div class="clock">
                <button onclick="mudarHorario()"> 🌙 Mudar para Noite </button>
            </div>
            <br>
        <div class="biome"> 
            <h1 id="titulo">🌍 Escolha seu Bioma</h1> 
            <button onclick="mudarBioma('floresta')">  Floresta </button> 
            <button onclick="mudarBioma('deserto')">  Deserto </button> 
            <button onclick="mudarBioma('neve')">  Neve </button> 
            <button onclick="mudarBioma('nether')">  Nether </button> 
        </div>
        <br>
        <div class="personagem" id="personagem"> 🧑 </div>
                <h2>Escolha a cabeça</h2> 
                <button onclick="mudarCabeca('😎')"> 😎 </button> 
                <button onclick="mudarCabeca('😈')"> 😈 </button> 
                <button onclick="mudarCabeca('🙂')"> 🙂 </button>
                <br>
            <h2>Escolha o item</h2> 
                <button onclick="mudarItem('⚔️')"> ⚔️ Espada </button> 
                <button onclick="mudarItem('⛏️')"> ⛏️ Picareta </button> 
                <button onclick="mudarItem('🏹')"> 🏹 Arco </button>
                <br>
        </div>

</body>
    <script> 
    let cabeca = "🧑"; 
    let item = ""; 
    function atualizarPersonagem() {
        document.getElementById("personagem").innerHTML = cabeca + "<br>" + item; 
    } function mudarCabeca(novaCabeca) {
        cabeca = novaCabeca; 
        atualizarPersonagem(); 
    } 
    function mudarItem(novoItem) { 
        item = novoItem; 
        atualizarPersonagem(); 
    }
    function mudarHorario() { 
    document.body.classList.toggle("noite"); 
    let titulo = document.getElementById("titulo"); 
    let botao = document.querySelector("button"); 
    if (document.body.classList.contains("noite")) { 
        titulo.innerHTML = "🌙 Minecraft à Noite"; 
        botao.innerHTML = "☀️ Mudar para Dia"; 
    } 
        else { titulo.innerHTML = "☀️ Minecraft de Dia"; 
        botao.innerHTML = "🌙 Mudar para Noite"; 
    } 
} 

    function mudarBioma(bioma) {
        const bodyvar = document.getElementById("corpo")
        if (bioma == "floresta") {
            bodyvar.style.backgroundImage = "url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQnwrIR_AqrkB8p4yZk05yEGy2hlr1e8hF9iye7NqC6qg&s=10')"; 
        } 
        else if (bioma == "deserto") { 
            bodyvar.style.backgroundImage = "url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQbZgnDu4YOf1IiCFej3STmTvb1yFfOFIX8xeoGao_Oaw&s=10')"; 
        } 
        else if (bioma == "neve") { 
            bodyvar.style.backgroundImage = "url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQDzjP9TvAqMaNt8eUXvmbiJOd-nPWJ5T7_z-L93b6dpQ&s=10')"; 
        } 
        else if (bioma == "nether") { 
            bodyvar.style.backgroundImage = "url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTujgjSVC8qpw8-S2fWUameOMB9CsmVMPd-m_iSYm5y7A&s=10')"; 
        }
    }
    </script>
            <style>
        button {
            padding: 15px; 
            margin: 5px; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer; 
            font-size: 16px; 
            
            
        }
        body {
            background-image: url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRGykqAVf3mPHOrY1zUc0eYQyTel7Ser1uvVSE_oVxhnQ&s=10');
            background-repeat: no-repeat;  
            background-position: top; 
            background-size: cover;
            height: 100vh; 
            width: 100vw;
            margin: 0; 
            display: flex;
            justify-content: center;
            align-content: center;
            align-items: center;
            transition: 0.5s;
        }
        
        .clock { 
            text-align: center;
        } 
        h1 { 
            color: white;
        } 
         button { 
            padding: 15px 25px; 
            font-size: 18px; 
            cursor: pointer; 
            border: none; 
            border-radius: 8px; 
        } 
        .noite { 
            background: #10152e; 
        }
        .caixa-texto {
            /* O segredo está aqui: o último número (0.6) define a opacidade do fundo (vai de 0 a 1) */
            background-color: rgba(0, 0, 0, 0.6); /* Fundo preto com 60% de opacidade */
            color: white; /* Cor do texto (permanece 100% visível) */
            padding: 20px; /* Espaço entre o texto e a borda da caixa */
            border-radius: 8px; /* Cantos arredondados (opcional) */
            height: 80vh;
            width: 80vw;
            justify-content: center;
        }
        nav {
            align-self: center;
            justify-content: center;
            background-color: black;
            text-decoration: white;        }
        </style>
</html>
