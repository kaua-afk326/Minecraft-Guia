<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Minecraft - Mina</title>
    <style>
        body {
            background-image: url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRGykqAVf3mPHOrY1zUc0eYQyTel7Ser1uvVSE_oVxhnQ&s=10');
            background-repeat: no-repeat;  
            background-position: top; 
            background-size: cover;
            height: 100vh; 
            width: 100vw;
            margin: 0; 
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Courier New', Courier, monospace;
            transition: 0.5s;
        }

        /* Camada escura para o modo Noite */
        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(10, 15, 45, 0);
            pointer-events: none;
            transition: background 0.5s ease;
            z-index: 1;
        }

        body.noite::after {
            background: rgba(10, 15, 45, 0.65);
        }

        /* Caixa principal estilo inventário/bloco do Minecraft */
        .caixa-texto {
            background-color: rgba(25, 25, 25, 0.88);
            border: 4px solid #555;
            box-shadow: inset 0 0 0 4px #222, 0 10px 25px rgba(0,0,0,0.7);
            color: white; 
            padding: 25px; 
            border-radius: 6px; 
            width: 480px;
            max-width: 92vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            z-index: 2;
        }

        /* Navegação padronizada */
        nav {
            display: flex;
            justify-content: center;
            gap: 15px;
            background-color: #111;
            border: 2px solid #444;
            padding: 10px 15px;
            border-radius: 4px;
            margin-bottom: 15px;
            width: 100%;
            box-sizing: border-box;
        }

        nav a {
            color: #ddd;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
            transition: 0.2s;
        }

        nav a:hover {
            color: #55ff55;
            transform: scale(1.05);
        }

        .topo-controles {
            width: 100%;
            display: flex;
            justify-content: flex-end;
            margin-bottom: 10px;
        }

        .btn-noite {
            padding: 6px 12px;
            font-size: 13px;
            background: #333;
            color: white;
            border: 2px solid #666;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
        }

        .btn-noite:hover {
            background: #444;
        }

        h1 {
            text-align: center;
            margin: 5px 0 15px 0;
            font-size: 24px;
            text-shadow: 2px 2px #000;
            color: #ffff55;
        }

        /* Painel de contadores estilo barra de inventário */
        .painel-contadores {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 10px;
            width: 100%;
            box-sizing: border-box;
            font-size: 14px;
            font-weight: bold;
            background-color: #111;
            border: 3px solid #444;
            padding: 10px;
            margin-bottom: 15px;
            text-shadow: 1px 1px #000;
        }

        /* Grade da Mina */
        .mina { 
            width: 100%; 
            max-width: 380px;
            margin: 10px auto 20px auto; 
            display: grid; 
            grid-template-columns: repeat(5, 1fr); 
            gap: 6px; 
        } 

        /* Blocos com relevo pixelado */
        .bloco { 
            height: 62px; 
            background-color: #7a7a7a; 
            border: 3px solid #3a3a3a; 
            box-shadow: inset 3px 3px 0 #9e9e9e, inset -3px -3px 0 #555555;
            cursor: pointer; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            font-size: 28px; 
            user-select: none;
            transition: 0.1s;
        } 

        .bloco:hover { 
            background-color: #8c8c8c;
            border-color: #55ff55;
            transform: scale(1.04); 
        } 

        .quebrado { 
            background-color: #181818; 
            border-color: #2c2c2c;
            box-shadow: inset 3px 3px 0 #0d0d0d;
            cursor: default; 
            transform: none !important;
        }

        /* Botão de Reset estilo clássico Minecraft (vermelho) */
        .btn-reset {
            background-color: #a82828;
            color: white;
            border: 3px solid #521111;
            box-shadow: inset 0 4px 0 #d63c3c, inset 0 -4px 0 #781919;
            padding: 12px 20px;
            width: 100%;
            font-size: 16px;
            font-family: inherit;
            font-weight: bold;
            text-shadow: 2px 2px #521111;
            cursor: pointer;
            transition: 0.1s;
        }

        .btn-reset:hover {
            background-color: #bf3030;
        }

        .btn-reset:active {
            transform: translateY(2px);
        }
    </style>
</head>
<body id="corpo">

    <div class="caixa-texto">
        <nav>
            <a href="/">🛏️ Respawn</a>
            <a href="/mina">⛏️ Minerar</a>
            <a href="/skins">👕 Skins</a>
            <a href="/menu">🏠 Menu</a>
        </nav>

        <div>
            <button id="botao-horario" onclick="mudarHorario()"> 🌙 Mudar para Noite </button>
        </div>

        <h1>⛏️ Minha Mina (RNG)</h1> 
        
        <!-- Contadores de Minérios -->
        <div class="painel-contadores">
            <span>💎 Diamante: <span id="qtd-diamante">0</span></span>
            <span>🪙 Ouro: <span id="qtd-ouro">0</span></span>
            <span>⚙️ Ferro: <span id="qtd-ferro">0</span></span>
            <span>🪨 Pedra: <span id="qtd-pedra">0</span></span>
        </div>

        <!-- Grade da Mina -->
        <div class="mina" id="grade-mina"> 
            <!-- Os blocos serão gerados automaticamente pelo JavaScript -->
        </div> 

        <button onclick="resetarMina()" style="background-color: #e74c3c; color: white;">🔄 Resetar / Nova Mina</button>
    </div>

    <script> 
        // Contadores
        let contadores = {
            diamante: 0,
            ouro: 0,
            ferro: 0,
            pedra: 0
        };

        const totalBlocos = 15; // Quantidade de blocos na mina

        function gerarMina() {
            const grade = document.getElementById("grade-mina");
            grade.innerHTML = ""; // Limpa a mina anterior

            for (let i = 0; i < totalBlocos; i++) {
                let blocoDiv = document.createElement("div");
                blocoDiv.classList.add("bloco");
                blocoDiv.innerHTML = "🪨";
                
                // Sorteia o minério do bloco usando RNG no momento em que cria
                let sorteio = Math.random() * 100; // Número de 0 a 100
                let minerioSorteado = "🪨";

                if (sorteio < 2) {
                    minerioSorteado = "💎"; // 2% de chance
                } else if (sorteio < 10) {
                    minerioSorteado = "🪙"; // 8% de chance (até 10%)
                } else if (sorteio < 35) {
                    minerioSorteado = "⚙️"; // 25% de chance (até 35%)
                } else {
                    minerioSorteado = "🪨"; // 65% restante é pedra
                }

                // Guarda o minério escondido dentro do elemento do bloco
                blocoDiv.dataset.minerio = minerioSorteado;

                // Adiciona o clique
                blocoDiv.onclick = function() {
                    minerar(this);
                };

                grade.appendChild(blocoDiv);
            }
        }

        function minerar(bloco) { 
            if (bloco.classList.contains("quebrado")) { 
                return; 
            } 

            let minerio = bloco.dataset.minerio;
            bloco.innerHTML = minerio;
            bloco.classList.add("quebrado");

            // Atualiza os contadores
            if (minerio === "💎") {
                contadores.diamante++;
                document.getElementById("qtd-diamante").innerText = contadores.diamante;
                alert("💎 UAU! Você encontrou um Diamante raro!");
            } else if (minerio === "🪙") {
                contadores.ouro++;
                document.getElementById("qtd-ouro").innerText = contadores.ouro;
            } else if (minerio === "⚙️") {
                contadores.ferro++;
                document.getElementById("qtd-ferro").innerText = contadores.ferro;
            } else {
                contadores.pedra++;
                document.getElementById("qtd-pedra").innerText = contadores.pedra;
            }
        }

        function resetarMina() {
            gerarMina();
        }

        function mudarHorario() { 
            document.body.classList.toggle("noite"); 
            let botao = document.getElementById("botao-horario"); 
            
            if (document.body.classList.contains("noite")) { 
                botao.innerHTML = "☀️ Mudar para Dia"; 
            } else { 
                botao.innerHTML = "🌙 Mudar para Noite"; 
            } 
        }

        // Gera a mina assim que a página carrega
        window.onload = gerarMina;
    </script>
</body>
</html>
