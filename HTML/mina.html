        <script> 
        let contador = 0; 
        function minerar(bloco) { 
            if (bloco.classList.contains("quebrado")) { 
                return; } if (bloco.innerHTML == "💎") 
            {
            contador++; 
            document.getElementById("contador").innerHTML = contador; 
            alert("💎 Você encontrou um diamante!"); 
            } 
            else { alert("🪨 Você encontrou pedra!"); 
            } 
            bloco.innerHTML = "💥"; 
            bloco.classList.add("quebrado"); 
            } 
        </script>
